name: Stage392 Wycheproof ML-DSA Verification

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage392-verification:
    name: Stage392 deterministic verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      OPENSSL_COMMIT: aae016bfd52fcad2bc9657c2c782cfdf73b1ed5f
      WYCHEPROOF_COMMIT: dac1dd4729fd1f8dd9e1e9f3dce51d783da6c166
      VECTOR_SHA256: 49ac366d76115eab56b7116f10d06e288e6f23fe6cfb90b26bfb2d731a8d1e02
      CANONICAL_FULL_SHA256: 1d2b89faf072eb527c442b1057eeec443abb77375665bc51da34fda321f43314

    steps:
      - name: Checkout Stage392
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Go 1.26.5
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: development/stage392/go.sum

      - name: Show environment
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          go version
          git --version
          clang --version

      - name: Verify fixed Stage392 SHA-256 bindings
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          expected = {
              "development/stage392/stage392_verification_result.json":
                  "c44ad9053429f8a8b36f6739af5982736abd98ea4860bddc3c0e1c216ca6633c",

              "development/stage392/stage392_wycheproof_full_execution_result.json":
                  "1d2b89faf072eb527c442b1057eeec443abb77375665bc51da34fda321f43314",

              "development/stage392/stage392_evidence_manifest.json":
                  "b1e976a9d1b0e1f7305144921a28ad7acff4d3adbe946c13d41b8ba9e2a82e71",

              "development/stage392/stage392_tooling_manifest.json":
                  "8d4646ba5e6088281f53cd44198c849213dd3cd407bf234011b4e01fadcf324e",

              "development/stage392/stage392_reproduction_manifest.json":
                  "8b0e1fe2cbec99d31d2e1a46296dd4d64f836bfa3e6954f43bac8baabd099d7a",

              "development/stage392/run_stage392_wycheproof_mldsa65.py":
                  "3a7faaa4a20526ea40a81c78590232ce39bf3fc66187dc0dc8bbf7e45eae206a",

              "development/stage392/verify_stage392_wycheproof.py":
                  "8b0b5cb056b26b6777f7abfdd68ee2d1916c9500b53bda2f96e1715fd05df947",

              "development/stage392/test_stage392_fail_closed.py":
                  "bb30dbda1da488b1d34f6c7d03dec142da21d9e75b1ce2ceaf261ac44ba3b865",
          }

          failures = []

          for filename, wanted in expected.items():
              path = Path(filename)

              if not path.is_file():
                  print("FAIL: missing", filename)
                  failures.append(filename)
                  continue

              actual = hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()

              print(filename)
              print("  actual   =", actual)
              print("  expected =", wanted)

              if actual != wanted:
                  failures.append(filename)

          if failures:
              raise SystemExit(
                  "FAIL: Stage392 fixed SHA binding mismatch"
              )

          print(
              "PASS: all fixed Stage392 SHA-256 bindings exact"
          )
          PY

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail

          python3 -m py_compile \
            development/stage392/verify_stage392_wycheproof.py \
            development/stage392/test_stage392_fail_closed.py \
            development/stage392/run_stage392_wycheproof_mldsa65.py

      - name: Run deterministic Stage392 verifier
        shell: bash
        run: |
          set -euo pipefail

          python3 \
            development/stage392/verify_stage392_wycheproof.py

      - name: Run 23-case Fail-Closed regression
        shell: bash
        run: |
          set -euo pipefail

          python3 \
            development/stage392/test_stage392_fail_closed.py

      - name: Fetch fixed Wycheproof source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/wycheproof"

          git clone \
            --no-checkout \
            https://github.com/C2SP/wycheproof.git \
            "$RUNNER_TEMP/wycheproof"

          git -C "$RUNNER_TEMP/wycheproof" \
            checkout \
            --detach \
            "$WYCHEPROOF_COMMIT"

          ACTUAL_HEAD="$(
            git -C "$RUNNER_TEMP/wycheproof" \
              rev-parse HEAD
          )"

          echo "actual_wycheproof_head=$ACTUAL_HEAD"
          echo "expected_wycheproof_head=$WYCHEPROOF_COMMIT"

          test "$ACTUAL_HEAD" = "$WYCHEPROOF_COMMIT"

      - name: Verify fixed Wycheproof vector SHA-256
        shell: bash
        run: |
          set -euo pipefail

          VECTOR="$RUNNER_TEMP/wycheproof/testvectors_v1/mldsa_65_verify_test.json"

          python3 - "$VECTOR" "$VECTOR_SHA256" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          expected = sys.argv[2]

          actual = hashlib.sha256(
              path.read_bytes()
          ).hexdigest()

          print("vector_sha256 =", actual)

          if actual != expected:
              raise SystemExit(
                  "FAIL: Wycheproof vector SHA mismatch"
              )

          print(
              "PASS: fixed Wycheproof vector exact"
          )
          PY

      - name: Fetch fixed OpenSSL 3.6.3 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/openssl-src"

          git clone \
            --no-checkout \
            https://github.com/openssl/openssl.git \
            "$RUNNER_TEMP/openssl-src"

          git -C "$RUNNER_TEMP/openssl-src" \
            checkout \
            --detach \
            "$OPENSSL_COMMIT"

          ACTUAL_HEAD="$(
            git -C "$RUNNER_TEMP/openssl-src" \
              rev-parse HEAD
          )"

          echo "actual_openssl_head=$ACTUAL_HEAD"
          echo "expected_openssl_head=$OPENSSL_COMMIT"

          test "$ACTUAL_HEAD" = "$OPENSSL_COMMIT"

      - name: Build fixed OpenSSL 3.6.3
        shell: bash
        run: |
          set -euo pipefail

          PREFIX="$RUNNER_TEMP/openssl-3.6.3"

          cd "$RUNNER_TEMP/openssl-src"

          ./Configure \
            --prefix="$PREFIX" \
            --libdir=lib \
            no-tests \
            no-shared

          make -j2

          make install_sw

          "$PREFIX/bin/openssl" version

          VERSION="$(
            "$PREFIX/bin/openssl" version |
            awk '{print $2}'
          )"

          test "$VERSION" = "3.6.3"

      - name: Build Stage392 OpenSSL EVP adapter
        shell: bash
        run: |
          set -euo pipefail

          PREFIX="$RUNNER_TEMP/openssl-3.6.3"

          clang \
            -std=c11 \
            -Wall \
            -Wextra \
            -Werror \
            -I"$PREFIX/include" \
            -L"$PREFIX/lib" \
            -Wl,-rpath,"$PREFIX/lib" \
            development/stage392/stage392_openssl_mldsa65_adapter.c \
            -lcrypto \
            -o "$RUNNER_TEMP/stage392-openssl-adapter"

          test -x "$RUNNER_TEMP/stage392-openssl-adapter"

      - name: Build Stage392 CIRCL v1.6.5 adapter
        shell: bash
        run: |
          set -euo pipefail

          cd development/stage392

          go list -m all

          CIRCL_VERSION="$(
            go list -m \
              -f '{{.Version}}' \
              github.com/cloudflare/circl
          )"

          echo "circl_version=$CIRCL_VERSION"

          test "$CIRCL_VERSION" = "v1.6.5"

          go build \
            -trimpath \
            -o "$RUNNER_TEMP/stage392-circl-adapter" \
            stage392_circl_mldsa65_adapter.go

          test -x "$RUNNER_TEMP/stage392-circl-adapter"

      - name: Reproduce all 210 Wycheproof ML-DSA-65 vectors
        shell: bash
        run: |
          set -euo pipefail

          python3 \
            development/stage392/run_stage392_wycheproof_mldsa65.py \
            --vectors \
              "$RUNNER_TEMP/wycheproof/testvectors_v1/mldsa_65_verify_test.json" \
            --openssl-adapter \
              "$RUNNER_TEMP/stage392-openssl-adapter" \
            --circl-adapter \
              "$RUNNER_TEMP/stage392-circl-adapter" \
            --output \
              "$RUNNER_TEMP/stage392-reproduced-result.json"

      - name: Verify canonical byte-for-byte reproduction
        shell: bash
        run: |
          set -euo pipefail

          REPRODUCED="$RUNNER_TEMP/stage392-reproduced-result.json"

          python3 - \
            "$REPRODUCED" \
            "$CANONICAL_FULL_SHA256" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          reproduced = Path(sys.argv[1])
          expected = sys.argv[2]

          actual = hashlib.sha256(
              reproduced.read_bytes()
          ).hexdigest()

          print("reproduced_sha256 =", actual)
          print("canonical_sha256  =", expected)

          if actual != expected:
              raise SystemExit(
                  "FAIL: reproduced result SHA mismatch"
              )

          print(
              "PASS: canonical full-result SHA reproduced"
          )
          PY

          cmp \
            "$REPRODUCED" \
            development/stage392/stage392_wycheproof_full_execution_result.json

          echo \
            "PASS: reproduced result is byte-for-byte identical"

      - name: Repeat full reproduction for determinism
        shell: bash
        run: |
          set -euo pipefail

          python3 \
            development/stage392/run_stage392_wycheproof_mldsa65.py \
            --vectors \
              "$RUNNER_TEMP/wycheproof/testvectors_v1/mldsa_65_verify_test.json" \
            --openssl-adapter \
              "$RUNNER_TEMP/stage392-openssl-adapter" \
            --circl-adapter \
              "$RUNNER_TEMP/stage392-circl-adapter" \
            --output \
              "$RUNNER_TEMP/stage392-reproduced-result-second.json"

          cmp \
            "$RUNNER_TEMP/stage392-reproduced-result.json" \
            "$RUNNER_TEMP/stage392-reproduced-result-second.json"

          echo \
            "PASS: repeated reproduction is byte-for-byte deterministic"

      - name: Final Stage392 CI decision
        shell: bash
        run: |
          set -euo pipefail

          echo "PASS: Stage392 CI verification complete"
          echo "PASS: deterministic canonical verifier"
          echo "PASS: 23 / 23 Fail-Closed regression tests"
          echo "PASS: fixed Wycheproof source and vector"
          echo "PASS: fixed OpenSSL 3.6.3 source"
          echo "PASS: CIRCL v1.6.5"
          echo "PASS: 210 / 210 Wycheproof ML-DSA-65 verification vectors"
          echo "PASS: canonical byte-for-byte reproduction"
          echo "PASS: repeat reproduction deterministic"
          echo
          echo "decision = wycheproof_mldsa65_cross_implementation_verified"
